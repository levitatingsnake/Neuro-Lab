name: NEURO//LAB smoke tests
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "stabilise-smoke-tests"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check navigation, inline JavaScript, and PWA assets
        run: node tests/smoke-test.mjs
